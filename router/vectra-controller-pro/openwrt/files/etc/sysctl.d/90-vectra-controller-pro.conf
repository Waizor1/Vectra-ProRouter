# vectra-controller-pro: room in the connection table for a burst of short
# connections (a torrent client's trackers, a page of many hosts). A closed
# TCP connection is kept 120 s by default: on 1111 (2026-09-30) a tracker
# storm filled 11,383 of its 15,360 entries, 10,101 of them closed. 30 s is
# what firewalls keep (MikroTik keeps 10 s).
net.netfilter.nf_conntrack_tcp_timeout_time_wait=30
# A SYN nobody answers (a torrent's dead peer) is kept 120 s by default: 30.
net.netfilter.nf_conntrack_tcp_timeout_syn_sent=30
