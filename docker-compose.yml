services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16-bookworm
    container_name: vectra-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./deploy/runtime/postgres:/var/lib/postgresql/data
    networks:
      vectra_internal:
        ipv4_address: 172.29.0.10
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: vectra-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: ${TZ:-UTC}
      DATABASE_URL: ${DATABASE_URL}
      VECTRA_OPERATOR_USER: ${VECTRA_OPERATOR_USER}
      VECTRA_OPERATOR_PASSWORD: ${VECTRA_OPERATOR_PASSWORD}
      VECTRA_DEFAULT_CONTROL_DOMAIN: ${VECTRA_DEFAULT_CONTROL_DOMAIN}
      VECTRA_ROUTER_API_BASE_URL: ${VECTRA_ROUTER_API_BASE_URL}
      VECTRA_POLLING_INTERVAL_SECONDS: ${VECTRA_POLLING_INTERVAL_SECONDS}
      VECTRA_SECRETS_KEY: ${VECTRA_SECRETS_KEY}
      VECTRA_ARTIFACT_BASE_URL: ${VECTRA_ARTIFACT_BASE_URL}
      NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED:-1}
      VECTRA_WEB_PUSH_PUBLIC_KEY: ${VECTRA_WEB_PUSH_PUBLIC_KEY:-}
      VECTRA_WEB_PUSH_PRIVATE_KEY: ${VECTRA_WEB_PUSH_PRIVATE_KEY:-}
      VECTRA_WEB_PUSH_SUBJECT: ${VECTRA_WEB_PUSH_SUBJECT:-mailto:admin@vectra-pro.net}
      VECTRA_WEB_PUSH_MONITOR_INTERVAL_SECONDS: ${VECTRA_WEB_PUSH_MONITOR_INTERVAL_SECONDS:-60}
      VECTRA_AUTO_ONBOARDING_ENABLED: ${VECTRA_AUTO_ONBOARDING_ENABLED:-false}
      # Anything the server reads from env.js MUST be listed here. Compose does
      # not forward .env to the container; --env-file only expands ${...} in
      # THIS file. A key present in .env but absent below reaches the app as
      # undefined and silently falls back to its schema default.
      #
      # VECTRA_AUTO_RESCUE_ENABLED defaults to false, so leaving it out did not
      # misconfigure the self-repair layer — it switched the layer off. The key
      # sat in production .env reading `true` from 2026-07-14, but the container
      # never saw it, and /api/health reported the monitor as up regardless. No
      # rescue case was opened after 2026-08-24; DmitryGubenko then sat in
      # direct mode for two days until an operator reconnected him by hand.
      VECTRA_AUTO_RESCUE_ENABLED: ${VECTRA_AUTO_RESCUE_ENABLED:-false}
      VECTRA_AUTO_RESCUE_MONITOR_INTERVAL_SECONDS: ${VECTRA_AUTO_RESCUE_MONITOR_INTERVAL_SECONDS:-60}
      VECTRA_AUTO_RESCUE_STALE_SECONDS: ${VECTRA_AUTO_RESCUE_STALE_SECONDS:-900}
      VECTRA_AUTO_RESCUE_ESCALATION_SECONDS: ${VECTRA_AUTO_RESCUE_ESCALATION_SECONDS:-600}
      VECTRA_STUCK_JOB_JANITOR_ENABLED: ${VECTRA_STUCK_JOB_JANITOR_ENABLED:-true}
      VECTRA_STUCK_JOB_JANITOR_INTERVAL_SECONDS: ${VECTRA_STUCK_JOB_JANITOR_INTERVAL_SECONDS:-120}
      VECTRA_STUCK_JOB_STALE_SECONDS: ${VECTRA_STUCK_JOB_STALE_SECONDS:-900}
      VECTRA_SNAPSHOT_RETENTION_ENABLED: ${VECTRA_SNAPSHOT_RETENTION_ENABLED:-true}
      VECTRA_SNAPSHOT_RETENTION_INTERVAL_SECONDS: ${VECTRA_SNAPSHOT_RETENTION_INTERVAL_SECONDS:-3600}
      VECTRA_SNAPSHOT_RETENTION_HOURS: ${VECTRA_SNAPSHOT_RETENTION_HOURS:-72}
      VECTRA_SNAPSHOT_RETENTION_KEEP_PER_ROUTER: ${VECTRA_SNAPSHOT_RETENTION_KEEP_PER_ROUTER:-20}
      VECTRA_SNAPSHOT_HEARTBEAT_MINUTES: ${VECTRA_SNAPSHOT_HEARTBEAT_MINUTES:-30}
      VECTRA_REVISION_RETENTION_ENABLED: ${VECTRA_REVISION_RETENTION_ENABLED:-true}
      VECTRA_REVISION_RETENTION_INTERVAL_SECONDS: ${VECTRA_REVISION_RETENTION_INTERVAL_SECONDS:-3600}
      VECTRA_REVISION_RETENTION_HOURS: ${VECTRA_REVISION_RETENTION_HOURS:-168}
      VECTRA_REVISION_RETENTION_KEEP_PER_ROUTER: ${VECTRA_REVISION_RETENTION_KEEP_PER_ROUTER:-10}
      VECTRA_TELEGRAM_BOT_TOKEN: ${VECTRA_TELEGRAM_BOT_TOKEN:-}
      VECTRA_TELEGRAM_ALLOWED_CHAT_IDS: ${VECTRA_TELEGRAM_ALLOWED_CHAT_IDS:-}
      VECTRA_TELEGRAM_WEBHOOK_SECRET: ${VECTRA_TELEGRAM_WEBHOOK_SECRET:-}
      VECTRA_TELEGRAM_CALLBACK_SECRET: ${VECTRA_TELEGRAM_CALLBACK_SECRET:-}
      VECTRA_TELEGRAM_DRY_RUN: ${VECTRA_TELEGRAM_DRY_RUN:-true}
    command:
      - /bin/sh
      - -lc
      - pnpm --filter @vectra/web db:migrate && pnpm --filter @vectra/web start --hostname 0.0.0.0 --port 3000
    volumes:
      - ./deploy/runtime/artifacts:/app/deploy/runtime/artifacts
    extra_hosts:
      - "postgres:172.29.0.10"
    networks:
      vectra_internal:
        ipv4_address: 172.29.0.11
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  caddy:
    image: public.ecr.aws/docker/library/caddy:2.8-alpine
    container_name: vectra-caddy
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      OPERATOR_DOMAIN: ${OPERATOR_DOMAIN}
      ROUTER_API_DOMAIN: ${ROUTER_API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/runtime/caddy/data:/data
      - ./deploy/runtime/caddy/config:/config
      - ./deploy/runtime/artifacts:/srv/artifacts
    extra_hosts:
      - "web:172.29.0.11"
    networks:
      vectra_internal:
        ipv4_address: 172.29.0.12
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:2019/config/
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  db-backup:
    image: public.ecr.aws/docker/library/postgres:16-bookworm
    container_name: vectra-db-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    command:
      - /bin/sh
      - -lc
      - while true; do sh /usr/local/bin/backup-postgres.sh; sleep "$${BACKUP_INTERVAL_SECONDS}"; done
    volumes:
      - ./deploy/runtime/backups:/backups
      - ./deploy/scripts/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
      - ./deploy/scripts/restore-postgres.sh:/usr/local/bin/restore-postgres.sh:ro
    extra_hosts:
      - "postgres:172.29.0.10"
    networks:
      vectra_internal:
        ipv4_address: 172.29.0.13
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  vectra_internal:
    name: vectra_internal
    ipam:
      config:
        - subnet: 172.29.0.0/24
